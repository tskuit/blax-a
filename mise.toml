# Local toolchain and tasks. Start with: mise install && mise run setup
[tools]
node = "24.21.0"
pnpm = "10.34.5"

[env]
# MELVIS_API_URL, LOCALAZY_* etc. Copy .env.example to .env.local.
_.file = ".env.local"

[tasks.setup]
description = "Install dependencies and the Playwright browser"
run = ["pnpm install", "pnpm exec playwright install chromium"]

[tasks.dev]
description = "Dev server: http://mittanbud.localhost:3000, servicefinder., remppatori., 3byggetilbud-match."
run = "pnpm dev"

[tasks.check]
description = "Lint, typecheck, format, unit tests, token and i18n checks (run before committing)"
run = "pnpm check"

[tasks.audit]
description = "Known vulnerabilities in production dependencies (high and critical fail; needs network)"
run = "pnpm audit --prod --audit-level=high"

[tasks.test]
description = "Unit tests"
run = "pnpm test"

[tasks.e2e]
description = "Melvis-independent E2E tests (builds and starts the app on :3100)"
run = "pnpm e2e"

[tasks."e2e:local"]
description = "E2E tests for views against your locally running melvis"
run = "pnpm e2e:local"

[tasks.build]
description = "Production build"
run = "pnpm build"

[tasks.start]
description = "Run the production build"
run = "pnpm start"

[tasks."docker:build"]
description = "Build the production image locally (deploys only; dev doesn't need Docker)"
run = "docker build --build-arg APP_VERSION=\"$(node -p \"require('./package.json').version\")+sha.$(git rev-parse --short HEAD)\" --build-arg GIT_SHA=\"$(git rev-parse HEAD)\" -t melvis-satellite:local ."

[tasks."ds:tokens"]
description = "Regenerate src/styles/tokens.css from design-system/tokens.json"
run = "pnpm ds:tokens"

[tasks."i18n:upload"]
description = "Upload src/locales/en.json to Localazy"
run = "pnpm i18n:upload"

[tasks."i18n:download"]
description = "Download translations from Localazy into src/locales/"
run = "pnpm i18n:download"
